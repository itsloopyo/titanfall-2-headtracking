name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Least privilege: this job checks out, builds and uploads an artifact. Artifact
# upload authenticates with the runner's own runtime token, not GITHUB_TOKEN, so
# nothing here needs write access to the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          submodules: recursive

      # C++ toolchain for the pixi `package` task's cmake/msbuild build.
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      # run-install: false because this workspace has NO conda dependencies -
      # pixi is the task runner that keeps CI and a developer on the same build
      # command, and nothing is fetched from a channel. setup-pixi's install
      # flow ends in `pixi list`, which exits 1 on an empty environment ("No
      # packages found in 'default' environment for 'win-64' platform"), so
      # letting it run fails the job before a single build step. There is no
      # input to skip just the listing. `pixi run` creates the environment on
      # demand anyway, so skipping the install costs nothing and caches nothing
      # that was ever worth caching.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      # Characterization tests for the camera maths. Ahead of packaging so a
      # regression in the arithmetic every rendered frame passes through fails
      # the run rather than shipping into an artifact. Needs no game installed.
      - name: Run tests
        shell: pwsh
        run: pixi run test

      # Build + package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain (configure -> build-release ->
      # package); the workflow owns no build steps, so local and CI can't drift.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      - name: Stage installer contents for artifact upload
        shell: pwsh
        run: |
          Write-Host "Staging installer contents..." -ForegroundColor Cyan

          $zip = Get-ChildItem -Path release -Filter "Titanfall2HeadTracking-*-installer.zip" | Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::No installer ZIP found under release/"
            exit 1
          }

          $contentsDir = "release/artifact-contents"
          if (Test-Path $contentsDir) {
            Remove-Item -Recurse -Force $contentsDir
          }
          New-Item -ItemType Directory -Path $contentsDir -Force | Out-Null

          Expand-Archive -Path $zip.FullName -DestinationPath $contentsDir -Force
          Write-Host "Staged $($zip.Name) to $contentsDir" -ForegroundColor Green

      - name: Compute artifact name from ref
        id: artifact_name
        shell: pwsh
        run: |
          $branch = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          $sanitized = $branch -replace '[^A-Za-z0-9._-]', '-'
          $name = "Titanfall2HeadTracking-$sanitized"
          echo "name=$name" >> $env:GITHUB_OUTPUT
          Write-Host "Artifact name: $name"

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: release/artifact-contents/
          retention-days: 14
          if-no-files-found: error
          overwrite: true
