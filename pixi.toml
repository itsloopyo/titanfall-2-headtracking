[workspace]
name = "titanfall-2-head-tracking"
version = "0.0.0"
description = "Head tracking mod for Titanfall 2 (Source Engine) using the CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
# Fetch cameraunlock-core on a fresh clone AND fast-forward it to origin/main.
# Deliberate dev action with a commit attached - nothing depends on it, and
# release.ps1's clean-tree precondition catches a stray bump before a tag.
sync = "git submodule update --init --remote cameraunlock-core"

# Titanfall 2 is 64-bit Source Engine - build x64.
# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = """
    powershell -Command "if (-not (Test-Path 'build')) { cmake -B build -A x64 } else { Write-Host 'Build directory exists, skipping setup' -ForegroundColor Yellow }"
""" }

build = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }
build-release = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }

clean = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

clean-all = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; if (Test-Path 'release') { Remove-Item 'release' -Recurse -Force }; Write-Host 'All build artifacts cleaned' -ForegroundColor Green"
""" }

# Characterization tests for the maths every rendered frame passes through.
# Needs no game and no engine, so it runs on CI and on a contributor's machine.
# build-release already builds the test target, so this only has to run it - and
# running the exe directly is what makes its exit code the task's exit code.
test = { cmd = "build/tests/Release/Titanfall2HeadTrackingTests.exe", depends-on = ["build-release"] }

# Bump vendored ASI Loader. Manual; commit the diff. CI does not run this.
update-deps = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }

# Print the installed client.dll's PE fingerprint as a paste-ready build-profile
# stub. First thing to run when the game patches or a user reports the dormant
# log line.
check-fingerprint = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/check-fingerprint.ps1" }

# Package release ZIP (installer + nexus variants).
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build-release"] }

# Cut a release: pixi run release <major|minor|patch|nightly|X.Y.Z>.
# `nightly` short-circuits to release-nightly.ps1, which republishes the rolling
# `dev` GitHub pre-release from the current commit.
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"

# Dev-tree deploy. scripts/install.cmd is the release-ZIP installer and reads
# its payload from a sibling plugins/ folder that only exists in the packaged
# ZIP, so it cannot run from the repo.
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build-release"] }
uninstall = "scripts\\uninstall.cmd /y"

[dependencies]
